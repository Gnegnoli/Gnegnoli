<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="PHP ZOMBIE DETECTOR">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFF6B"><animate attributeName="stop-color" values="#7CFF6B;#00F0FF;#7CFF6B" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00F0FF"><animate attributeName="stop-color" values="#00F0FF;#7CFF6B;#00F0FF" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#110c20"/><stop offset="1" stop-color="#0a0812"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#7CFF6B" stop-opacity="0.28"/><stop offset="1" stop-color="#7CFF6B" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1.5" y="1.5" width="457" height="197" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
  <rect x="1.5" y="1.5" width="457" height="197" rx="16" fill="url(#gl)"/>
  <g font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif">
    <circle cx="30" cy="40" r="5" fill="#7CFF6B" filter="url(#g)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="46" y="47" font-size="21" font-weight="800" letter-spacing="1.5" fill="#7CFF6B" filter="url(#g)">PHP ZOMBIE DETECTOR</text>
    <text x="24" y="86" font-size="14" fill="#b9bfd9">Plugin JetBrains per scovare codice PHP morto</text><text x="24" y="106" font-size="14" fill="#b9bfd9">e "zombie" nei progetti. Work in progress.</text>
    <g transform="translate(24 156)"><rect width="66" height="24" rx="12" fill="#7CFF6B" fill-opacity="0.12" stroke="#7CFF6B" stroke-opacity="0.6"/><text x="33.0" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">Kotlin</text></g><g transform="translate(98 156)"><rect width="147" height="24" rx="12" fill="#7CFF6B" fill-opacity="0.12" stroke="#7CFF6B" stroke-opacity="0.6"/><text x="73.5" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">IntelliJ Platform</text></g><g transform="translate(253 156)"><rect width="44" height="24" rx="12" fill="#7CFF6B" fill-opacity="0.12" stroke="#7CFF6B" stroke-opacity="0.6"/><text x="22.0" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">PHP</text></g>
  </g>
</svg>
