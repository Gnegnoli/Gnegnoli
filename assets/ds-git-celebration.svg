<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="DSGitCelebration">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2BD6"><animate attributeName="stop-color" values="#FF2BD6;#FFB86B;#FF2BD6" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#FFB86B"><animate attributeName="stop-color" values="#FFB86B;#FF2BD6;#FFB86B" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#110c20"/><stop offset="1" stop-color="#0a0812"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#FF2BD6" stop-opacity="0.28"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1.5" y="1.5" width="457" height="197" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
  <rect x="1.5" y="1.5" width="457" height="197" rx="16" fill="url(#gl)"/>
  <g font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif">
    <circle cx="30" cy="40" r="5" fill="#FF2BD6" filter="url(#g)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="46" y="47" font-size="21" font-weight="800" letter-spacing="1.5" fill="#FF2BD6" filter="url(#g)">DSGitCelebration</text>
    <text x="24" y="86" font-size="14" fill="#b9bfd9">Plugin JetBrains che celebra commit, merge,</text><text x="24" y="106" font-size="14" fill="#b9bfd9">push e pull con overlay animati e suoni</text><text x="24" y="126" font-size="14" fill="#b9bfd9">in stile Dark Souls.</text>
    <g transform="translate(24 156)"><rect width="51" height="24" rx="12" fill="#FF2BD6" fill-opacity="0.12" stroke="#FF2BD6" stroke-opacity="0.6"/><text x="25.5" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">Java</text></g><g transform="translate(83 156)"><rect width="147" height="24" rx="12" fill="#FF2BD6" fill-opacity="0.12" stroke="#FF2BD6" stroke-opacity="0.6"/><text x="73.5" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">IntelliJ Platform</text></g><g transform="translate(238 156)"><rect width="81" height="24" rx="12" fill="#FF2BD6" fill-opacity="0.12" stroke="#FF2BD6" stroke-opacity="0.6"/><text x="40.5" y="16.5" text-anchor="middle" font-size="12" fill="#e6e8ff">PhpStorm</text></g>
  </g>
