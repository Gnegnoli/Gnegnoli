<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Andrea Cavallaro aka Gnegnoli">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07060d"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2bd6;#b26bff;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#b26bff">
        <animate attributeName="stop-color" values="#b26bff;#00f0ff;#ff2bd6;#b26bff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#b26bff;#00f0ff;#ff2bd6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="200" width="1200" height="120" fill="url(#gridFade)"/>
    </mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- stelle -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="90" r="1" opacity="0.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="1" opacity="0.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="25" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="80" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="140" r="0.9" opacity="0.4"/>
    <circle cx="150" cy="150" r="0.9" opacity="0.4"/>
  </g>

  <!-- sole synthwave -->
  <g transform="translate(600 210)">
    <circle r="120" fill="url(#horizon)" opacity="0.35" filter="url(#softGlow)"/>
  </g>

  <!-- orizzonte -->
  <rect x="0" y="208" width="1200" height="2" fill="#ff2bd6" opacity="0.8" filter="url(#softGlow)"/>

  <!-- griglia prospettica animata -->
  <g mask="url(#gridMask)" stroke="#b26bff" stroke-width="1.2" opacity="0.7">
    <g>
      <line x1="0" y1="215" x2="1200" y2="215"/>
      <line x1="0" y1="225" x2="1200" y2="225"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="260" x2="1200" y2="260"/>
      <line x1="0" y1="286" x2="1200" y2="286"/>
      <line x1="0" y1="318" x2="1200" y2="318"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <line x1="600" y1="210" x2="600" y2="320"/>
    <line x1="600" y1="210" x2="480" y2="320"/>
    <line x1="600" y1="210" x2="720" y2="320"/>
    <line x1="600" y1="210" x2="340" y2="320"/>
    <line x1="600" y1="210" x2="860" y2="320"/>
    <line x1="600" y1="210" x2="160" y2="320"/>
    <line x1="600" y1="210" x2="1040" y2="320"/>
    <line x1="600" y1="210" x2="-60" y2="320"/>
    <line x1="600" y1="210" x2="1260" y2="320"/>
    <line x1="600" y1="210" x2="-320" y2="320"/>
    <line x1="600" y1="210" x2="1520" y2="320"/>
  </g>

  <!-- skyline stile Code City -->
  <g fill="#0b0816" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1">
    <rect x="70" y="150" width="34" height="58"/>
    <rect x="110" y="128" width="26" height="80"/>
    <rect x="142" y="165" width="40" height="43"/>
    <rect x="188" y="140" width="22" height="68"/>
    <rect x="990" y="136" width="28" height="72"/>
    <rect x="1024" y="160" width="44" height="48"/>
    <rect x="1074" y="120" width="24" height="88"/>
    <rect x="1104" y="152" width="36" height="56"/>
  </g>
  <g fill="#00f0ff" opacity="0.7">
    <rect x="116" y="140" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="126" y="160" width="4" height="4"/>
    <rect x="1080" y="134" width="4" height="4"/>
    <rect x="1088" y="170" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="80" y="165" width="4" height="4" fill="#ff2bd6"/>
    <rect x="1034" y="176" width="4" height="4" fill="#ff2bd6"/>
  </g>

  <!-- testo -->
  <g font-family="'Segoe UI', 'Ubuntu', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="20" letter-spacing="8" fill="#9aa4c7" font-weight="600">HELLO WORLD, I'M</text>
    <text x="600" y="152" font-size="62" font-weight="800" letter-spacing="4" fill="url(#neon)" filter="url(#glow)">ANDREA CAVALLARO</text>
    <text x="600" y="190" font-size="20" letter-spacing="3" fill="#e6e8ff" font-weight="600">
      <tspan fill="#00f0ff">aka Gnegnoli</tspan>
      <tspan fill="#6b6f8e"> · </tspan>
      <tspan>Full-stack developer</tspan>
      <tspan fill="#6b6f8e"> · </tspan>
      <tspan fill="#ff2bd6">Liguria, Italia</tspan>
    </text>
  </g>

  <rect width="1200" height="320" fill="url(#scan)"/>
</svg>
